name: Keep booking server awake

# Render's free tier sleeps after ~15 minutes idle, which makes the first
# visitor wait up to a minute. Pinging every 10 minutes keeps it warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS --max-time 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://aklass-backend.onrender.com/settings/public || true
